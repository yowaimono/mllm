[package]
name = "llm-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
chrono-tz = "0.10.1"
reqwest = { version = "0.12.12", features = ["blocking", "json", "stream", "gzip", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
futures-util = "0.3"
tokio = { version = "1.34", features = ["full"] }
tokio-stream = "0.1"
bytes = "1.0"
pin-project = "1.0"
futures-core = "0"
regex = "1.5"
flate2 = "1.0"
rusqlite = { version = "0.31.0", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1.34", features = ["rt-multi-thread", "macros"] }
futures-util = "0.3"
